# Alertmanager / Prometheus 알람 규칙 — idea-collection 청킹 SLO (Step 5).
#
# book §16.10.3 권장 SLO 와 §16.10.5 운영 권고를 알람으로 변환:
#   - chunking_fits_context=false 비율 < 10% (정상 트래픽)
#   - chunking_overlap_inflation_ratio ≤ 1.35 (overlap_ratio 0.15 기준)
#   - chunking_context_overflow_total : 5분간 1건 이상이면 즉시 경고
#
# 발화 조건은 flow 라벨로 분리해 서비스별로 독립적인 신호를 만든다.
# Alertmanager 가 별도 설정되지 않은 환경에서도 Prometheus /alerts UI 와
# /api/v1/rules 에서 발화 상태를 확인할 수 있어 SLO 검증의 1차 자료로 쓰인다.

groups:
  - name: chunking_slo
    interval: 30s
    rules:
      # ── 컨텍스트 오버플로우 (가장 critical) ───────────────────────────
      - alert: ChunkingContextOverflow
        expr: increase(chunking_context_overflow_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: idea-collection-ops
          slo: chunking_context_overflow
        annotations:
          summary: 'flow={{ $labels.flow }} 에서 컨텍스트 오버플로우 발생'
          description: |
            service={{ $labels.service }} flow={{ $labels.flow }} 에서 최근 5분간
            chunking_context_overflow_total 이 {{ $value | printf "%.0f" }}건 증가했다.
            §16.10.5 운영 권고에 따라 LM Studio num_ctx 또는 REVIEWER_* 환경변수를
            점검할 것. (book/part6/ch16-phase2-extensions.md)

      # ── 단일 호출 fits 비율 < 90% (5분 윈도우) ─────────────────────────
      - alert: ChunkingFitsRateLow
        expr: |
          (
            avg_over_time(chunking_fits_context[5m])
          ) < 0.9
        for: 5m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: chunking_fits_rate
        annotations:
          summary: 'flow={{ $labels.flow }} 의 fits_context 5분 평균이 90% 미만'
          description: |
            service={{ $labels.service }} flow={{ $labels.flow }} 의 chunking_fits_context
            5분 평균이 {{ $value | printf "%.2f" }} 로 0.9 미만이다. 입력이 모델창에
            맞지 않아 청크 분할이 자주 일어나고 있다 — 호출자 측 입력 축소 또는
            상위 모델로 라우팅을 검토할 것.

      # ── overlap 인플레이션 비율 과다 (1.5 초과) ────────────────────────
      - alert: ChunkingOverlapInflationHigh
        expr: |
          avg_over_time(chunking_overlap_inflation_ratio[10m]) > 1.5
        for: 10m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: chunking_overlap_inflation
        annotations:
          summary: 'flow={{ $labels.flow }} 의 overlap 인플레이션 1.5 초과'
          description: |
            service={{ $labels.service }} flow={{ $labels.flow }} 의 평균 overlap
            inflation 이 {{ $value | printf "%.2f" }} 로 §16.10.3 권고 (≤1.35) 를
            초과했다. CHUNKING_OVERLAP_RATIO 를 0.10 으로 낮추거나 청크 본문 budget
            을 늘릴 것.

      # ── 청크 실패 비율 (실패 / 시도) 1분 윈도우 ────────────────────────
      - alert: ChunkingFailureRateHigh
        expr: |
          (
            rate(chunking_chunks_failed_total[5m])
            /
            clamp_min(
              rate(chunking_chunks_success_total[5m])
              + rate(chunking_chunks_failed_total[5m]),
              0.001
            )
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: chunking_failure_rate
        annotations:
          summary: 'flow={{ $labels.flow }} 의 청크 실패율 5% 초과'
          description: |
            service={{ $labels.service }} flow={{ $labels.flow }} 의 청크 실패율이
            {{ $value | printf "%.1%%" }} 로 5% 임계를 넘었다. 호출자 측 LLM 에러를
            확인하고, Reviewer/Generator 단계의 입력 가드를 점검할 것.

      # ── total latency p95 30s 초과 (청크 늘면서 응답 지연 증가) ────────
      - alert: ChunkingTotalLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service, flow) (rate(chunking_total_seconds_bucket[5m]))
          ) > 30
        for: 10m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: chunking_latency_p95
        annotations:
          summary: 'flow={{ $labels.flow }} p95 latency 30s 초과'
          description: |
            service={{ $labels.service }} flow={{ $labels.flow }} 의
            chunking_total_seconds p95 가 {{ $value | printf "%.1f" }}s 다.
            §16.10.3 권고 (+30% 미만/청크) 를 검증할 것.

  - name: chunking_meta
    interval: 60s
    rules:
      # ── invocations 가 0 이면 scrape 는 되지만 호출이 한 번도 없는 상태.
      #    경고는 아니지만 운영 가시성을 위해 별도 그룹으로 분리.
      - alert: ChunkingNoInvocations
        expr: |
          (sum by (service, flow) (chunking_invocations_total)) == 0
          unless on() vector(0) > 0
        for: 30m
        labels:
          severity: info
          team: idea-collection-ops
          slo: chunking_invocations
        annotations:
          summary: 'flow={{ $labels.flow }} 30분간 호출 0건'
          description: |
            service={{ $labels.service }} flow={{ $labels.flow }} 가 30분 동안
            한 번도 호출되지 않았다. 통상적인 dev 환경이라면 무시 가능. 운영에서
            중요 flow 라면 호출 경로 단절을 의심할 것.

  # ──────────────────────────────────────────────────────────────────
  # SaaS billing SLO (C Week 3 Day 3, 2026-05-12)
  #
  # ADK + CoOps 가 ``shared.saas`` 의 record_call / enforce_quota /
  # switch_subscription / handle_event 를 통해 발행하는 saas_* 메트릭에 대한 알람.
  # ──────────────────────────────────────────────────────────────────
  - name: saas_billing
    interval: 30s
    rules:
      # ── 429 차단율 5% 초과 (5분 평균) — 유료 전환 권유 시그널 ────────
      - alert: SaaSQuotaBlockedRateHigh
        expr: |
          (
            rate(saas_quota_blocked_total[5m])
            /
            clamp_min(
              rate(saas_calls_total[5m])
              + rate(saas_quota_blocked_total[5m]),
              0.001
            )
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: saas_quota_block_rate
        annotations:
          summary: 'service={{ $labels.service }} plan={{ $labels.plan_code }} 429 비율 5% 초과'
          description: |
            saas_quota_blocked_total / (saas_calls_total + saas_quota_blocked_total)
            의 5분 평균이 5% 를 넘었다. 무료 플랜 사용자가 업그레이드 시점에
            도달했을 가능성. /admin/stats 에서 plan_distribution 을 점검하고
            업그레이드 안내 이메일/Slack 알림을 자동화 검토 (B-7 백로그
            Customer Portal 과 연계).

      # ── 호출 실패율 (status=failed / status=allowed) 3% 초과 ─────────
      - alert: SaaSCallFailureRateHigh
        expr: |
          (
            sum by (service) (rate(saas_calls_total{status="failed"}[5m]))
            /
            clamp_min(
              sum by (service) (rate(saas_calls_total[5m])),
              0.001
            )
          ) > 0.03
        for: 5m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: saas_call_failure_rate
        annotations:
          summary: 'service={{ $labels.service }} 호출 실패율 3% 초과'
          description: |
            ``record_call(success=False)`` 호출 비율이 5분 평균 3% 를 넘었다.
            대개 LM Studio 다운 또는 Orchestrator 응답 파싱 실패. ADK/CoOps
            컨테이너 로그와 LM Studio /v1/models 응답을 점검할 것.

      # ── Stripe webhook ignored action 비율 — 미지원 이벤트 누락 시그널 ──
      - alert: SaaSStripeIgnoredEventsHigh
        expr: |
          rate(saas_stripe_webhook_events_total{action="ignored"}[10m]) > 0.5
        for: 10m
        labels:
          severity: info
          team: idea-collection-ops
          slo: saas_stripe_unsupported
        annotations:
          summary: 'service={{ $labels.service }} 미지원 Stripe 이벤트 빈도 ↑'
          description: |
            event_type={{ $labels.event_type }} 가 ignored 처리되고 있다. B-7
            2 라운드 백로그 (invoice.* / customer.* / refund.*) 의 우선 순위를
            재검토할 시점.

      # ── plan 전환 0건 (운영 점검용 info) ───────────────────────────
      - alert: SaaSNoPlanTransitions24h
        expr: |
          (
            sum by (service) (increase(saas_plan_transitions_total[24h]))
          ) == 0
          unless on() vector(0) > 0
        for: 1h
        labels:
          severity: info
          team: idea-collection-ops
          slo: saas_plan_transitions
        annotations:
          summary: 'service={{ $labels.service }} 24시간 plan 전환 0건'
          description: |
            24시간 동안 admin /subscribe 또는 Stripe webhook 으로 plan 전환이
            한 건도 발생하지 않았다. 가입 깔때기가 정체 중일 수 있다 — 베타
            온보딩 캠페인 또는 가격 페이지 트래픽 점검.

  # ──────────────────────────────────────────────────────────────────
  # MEDI clinical SLO (D R2 Day 4, 2026-05-13)
  #
  # VISION 자동 승격 (auto_promote) 메트릭과 임상 검토 큐 (DiagnosisReview)
  # 의 운영 신호. 한장요약 §의료 안전 — 자동 승격은 보조이며 의사 검토는
  # 필수, 따라서 알람도 안전판 위주.
  # ──────────────────────────────────────────────────────────────────
  - name: medi_clinical
    interval: 60s
    rules:
      # ── 자동 승격이 1시간 0건이면 워크플로 단절 의심 (info) ────────
      - alert: MEDIAutoPromoteSilent1h
        expr: |
          sum(increase(medi_auto_promote_total{outcome="promoted"}[1h])) == 0
          unless on() vector(0) > 0
        for: 30m
        labels:
          severity: info
          team: idea-collection-ops
          slo: medi_auto_promote
        annotations:
          summary: 'MEDI 자동 승격 1시간 0건 (VISION→DiagnosisReview)'
          description: |
            ``medi_auto_promote_total{outcome="promoted"}`` 가 1시간 동안 0건이다.
            CONSENSUS 라우팅 또는 confidence 임계값이 너무 높을 수 있다.
            ``MEDI_AUTO_PROMOTE_MIN_CONFIDENCE`` / ``MEDI_AUTO_PROMOTE_CONSENSUS_ONLY``
            환경변수를 점검하라.

      # ── skipped_low_confidence 비율 80% 초과 — VISION 품질 저하 신호 ─
      - alert: MEDIAutoPromoteLowConfidenceRateHigh
        expr: |
          (
            sum(rate(medi_auto_promote_total{outcome="skipped_low_confidence"}[15m]))
            /
            clamp_min(
              sum(rate(medi_auto_promote_total[15m])),
              0.001
            )
          ) > 0.8
        for: 15m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: medi_auto_promote_quality
        annotations:
          summary: 'MEDI VISION confidence 저하 — skipped 비율 80% 초과'
          description: |
            ``medi_auto_promote_total{outcome="skipped_low_confidence"}`` 가 전체의
            80% 를 넘었다. CONSENSUS 모델 중 하나가 응답 품질이 떨어졌거나
            LM Studio 가 다운됐을 가능성. /metrics 에 라벨링된 outcome 분포와
            ``medi-iot-api`` 로그를 함께 점검할 것.

      # ── 검토 대기 큐 100건 초과 (별도 collector 필요 — medi_review_pending) ─
      - alert: MEDIReviewQueueBacklog
        expr: medi_review_pending > 100
        for: 30m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: medi_review_queue
        annotations:
          summary: 'MEDI 의사 검토 큐 100건 초과 (의사 처리 지연)'
          description: |
            ``DiagnosisReview status='pending_review'`` 가 100건을 넘어섰다.
            의사 인력 추가 또는 검토 우선순위 (severity=critical 부터) 재정렬을
            검토할 것.

  # ──────────────────────────────────────────────────────────────────
  # MEDI R3 — Stripe 실연동 (D1, 2026-05-18)
  # ──────────────────────────────────────────────────────────────────
  - name: medi_r3_stripe
    interval: 60s
    rules:
      - alert: MEDIStripeWebhookErrorsHigh
        expr: |
          sum(rate(saas_stripe_webhook_events_total{service="medi",action=~"error|failed"}[15m])) > 0.1
        for: 10m
        labels:
          severity: warning
          team: idea-collection-ops
          slo: medi_stripe_webhook
        annotations:
          summary: 'MEDI Stripe webhook 오류율 상승'
          description: |
            ``MEDI_STRIPE_WEBHOOK_SECRET`` · ``stripe listen`` 포트 8001 정합,
            ``scripts/stripe-webhook-docker-smoke.sh medi-iot-api`` 로 재검증.
