# Grafana 자동 프로비저닝 — Prometheus 데이터소스 (Step 5).
#
# Grafana 컨테이너 기동 시 /etc/grafana/provisioning/datasources/ 의 yaml 을
# 자동으로 등록한다. URL 은 docker-compose 네트워크의 컨테이너 이름 'prometheus'
# 로 해석된다.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus       # 대시보드 JSON 의 datasource.uid 와 매칭 (고정값 필수)
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'
      httpMethod: POST
