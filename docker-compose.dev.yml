# ============================================================
# docker-compose.dev.yml
# WSL2 + Docker 개발 환경
# LM Studio (Windows, 포트 8000) 연결 — Ollama 컨테이너 불필요
# OpenClaw + Paperclip + PostgreSQL + Redis
# MEDI-IOT + AutoNoGaDa + CoOps
# ============================================================
# 실행: docker compose -f docker-compose.dev.yml up -d
# 중지: docker compose -f docker-compose.dev.yml down
# 로그: docker compose -f docker-compose.dev.yml logs -f
# ============================================================


# ============================================================
# 공통 LLM 환경변수 (모든 서비스에서 재사용)
# ============================================================
x-llm-env: &llm-env
  # ── Provider 선택 (local | openai | anthropic | google | azure) ──
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  LLM_EMBED_PROVIDER: ${LLM_EMBED_PROVIDER:-local}
  LLM_FALLBACK_ENABLED: "true"

  # ── Local Provider — LM Studio (Windows 포트 8000) ──
  LOCAL_BASE_URL: http://host.docker.internal:8000/v1
  LOCAL_API_KEY: lm-studio
  LOCAL_FAST_MODEL: google/gemma-4-e4b
  LOCAL_HEAVY_MODEL: google/gemma-4-26b-a4b
  LOCAL_VISION_MODEL: google/gemma-4-26b-a4b
  LOCAL_EMBED_MODEL: text-embedding-nomic-embed-text-v1.5
  LOCAL_BACKUP_MODEL: mistralai/mistral-7b-instruct-v0.3

  # Orchestrator / 컨텍스트 예산 · 청킹 (.env 또는 export 로 덮어쓰기 가능)
  ORCH_COMPACT_CONTEXT: ${ORCH_COMPACT_CONTEXT:-1}
  ORCH_CONTEXT_MAX_TOKENS: ${ORCH_CONTEXT_MAX_TOKENS:-12000}
  CHUNKING_MAX_PARALLEL: ${CHUNKING_MAX_PARALLEL:-4}
  CHUNKING_OVERLAP_RATIO: ${CHUNKING_OVERLAP_RATIO:-0.15}
  CHUNKING_HISTORY_MAX_TOKENS: ${CHUNKING_HISTORY_MAX_TOKENS:-8000}
  CHUNKING_CONVERSATION_RECENT_TURNS: ${CHUNKING_CONVERSATION_RECENT_TURNS:-5}

  # Step 6 — LLM 요약 레이어 (옵션, 기본 OFF). 1로 켜면 Reviewer trim 의
  # fallback='chars' 케이스에서 light 모델(LLM_SUMMARY_MODEL)로 1-call 요약을
  # 시도한다. 운영자가 LM Studio num_ctx 를 ≥ 4096 으로 늘릴 수 없는 환경의
  # 보조 가드. 자세한 정책은 book §16.10.7 / env-reference.md 참고.
  LLM_SUMMARY_LAYER_ENABLED: ${LLM_SUMMARY_LAYER_ENABLED:-0}
  LLM_SUMMARY_TRIGGER: ${LLM_SUMMARY_TRIGGER:-chars}
  LLM_SUMMARY_MAX_TOKENS: ${LLM_SUMMARY_MAX_TOKENS:-512}
  LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-google/gemma-4-e4b}
  LLM_SUMMARY_BASE_URL: ${LLM_SUMMARY_BASE_URL:-http://host.docker.internal:8000/v1}
  LLM_SUMMARY_API_KEY: ${LLM_SUMMARY_API_KEY:-lm-studio}
  LLM_SUMMARY_TIMEOUT: ${LLM_SUMMARY_TIMEOUT:-30}

  # ── Cloud API Keys (운영 시 .env 파일에서 주입) ──
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}

# 공통 DB/Redis 환경변수
x-db-env: &db-env
  DATABASE_URL: postgresql://dev:dev@postgres:5432/mediiot
  REDIS_URL: redis://redis:6379
  PYTHONUNBUFFERED: "1"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-week7-dev-secret-not-for-prod}

# 공통 의존성
x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

# host.docker.internal → Windows 호스트 연결 (WSL Linux 필수 설정)
x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ============================================================
  # 1. shared-libraries (공통 라이브러리 — 개발/테스트)
  # ============================================================
  shared-libs:
    build:
      context: ./shared-libraries
      dockerfile: Dockerfile
    container_name: shared-libs-dev
    ports:
      - "8004:8000"
    volumes:
      - ./shared-libraries:/app
    environment:
      <<: [*llm-env, *db-env]
    depends_on:
      <<: *depends-infra
    <<: *extra-hosts
    networks:
      - mediiot-network
    command: sleep infinity   # 컨테이너 유지 — exec으로 직접 명령 실행
    restart: "no"

  # ============================================================
  # 2. MEDI-IOT EyeCare API (Phase 1 메인)
  # ============================================================
  medi-iot-api:
    build:
      context: ./MEDI-IOT-EyeCare
      dockerfile: Dockerfile
    container_name: medi-iot-api-dev
    env_file:
      - path: .env.local
        required: false
    ports:
      - "8001:8000"
    volumes:
      - ./MEDI-IOT-EyeCare:/app                    # 앱 소스 (hot-reload)
      - ./shared-libraries:/app/shared-libraries    # shared-libs 직접 마운트
    environment:
      <<: [*llm-env, *db-env]
      SERVICE_NAME: medi-iot
      LLM_DEFAULT_ROLE: vision
      # shared-libraries 절대 import 가능하도록 PYTHONPATH 설정
      PYTHONPATH: /app/shared-libraries:/app
      # D R3 D1 — MEDI Stripe (Price ID·whsec 는 projects/.env.local — env_file)
      MEDI_STRIPE_ENABLED: "1"
      MEDI_STRIPE_SECRET_KEY: "${MEDI_STRIPE_SECRET_KEY:-}"
      MEDI_STRIPE_SKIP_SIG_VERIFY: "1"
      # D R3 D3 — VISION multi-modal (2+ 모델 시 consensus 자동)
      MEDI_VISION_MODE: ${MEDI_VISION_MODE:-consensus}
      MEDI_VISION_MODELS: ${MEDI_VISION_MODELS:-google/gemma-4-26b-a4b,mistralai/mistral-7b-instruct-v0.3}
      MEDI_VISION_CONSENSUS_MIN_AGREE: ${MEDI_VISION_CONSENSUS_MIN_AGREE:-2}
      # D R4-ML D3 — Retinal CNN inference (기본 llm; 스모크 시 cnn|ensemble)
      MEDI_INFERENCE_BACKEND: ${MEDI_INFERENCE_BACKEND:-llm}
      MEDI_CNN_MODEL_PATH: ${MEDI_CNN_MODEL_PATH:-models/retinal_v1.onnx}
      MEDI_CNN_ARCH: ${MEDI_CNN_ARCH:-efficientnet_b4}
      MEDI_CNN_CONFIDENCE_MIN: ${MEDI_CNN_CONFIDENCE_MIN:-0.70}
      MEDI_AUTO_PROMOTE_ALLOW_CNN: ${MEDI_AUTO_PROMOTE_ALLOW_CNN:-1}
      # D R3 D2 — S3/MinIO (기본 local; 스모크 시 STORAGE_BACKEND=s3)
      STORAGE_BACKEND: ${MEDI_STORAGE_BACKEND:-local}
      S3_BUCKET: ${MEDI_S3_BUCKET:-medi-dev}
      S3_REGION: ${MEDI_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MEDI_AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MEDI_AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_ENDPOINT_URL: ${MEDI_AWS_ENDPOINT_URL:-http://minio:9000}
    depends_on:
      <<: *depends-infra
    <<: *extra-hosts
    networks:
      - mediiot-network
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  # ============================================================
  # 3. OpenClaw (Agent Runtime — Node.js)
  # ============================================================
  openclaw:
    image: node:18-alpine
    container_name: openclaw-runtime
    working_dir: /app/openclaw
    ports:
      - "3010:3000"
    volumes:
      - ./openclaw:/app/openclaw
      - /app/openclaw/node_modules
    environment:
      NODE_ENV: development
      # LM Studio 연결 (OpenClaw에서 직접 호출 시)
      LLM_BASE_URL: http://host.docker.internal:8000/v1
      LLM_API_KEY: lm-studio
      LLM_FAST_MODEL: google/gemma-4-e4b
      # 내부 서비스 연결
      PAPERCLIP_HOST: http://paperclip:8080
      DATABASE_URL: postgresql://dev:dev@postgres:5432/mediiot
      REDIS_URL: redis://redis:6379
    depends_on:
      <<: *depends-infra
    <<: *extra-hosts
    networks:
      - mediiot-network
    command: npm run dev
    restart: unless-stopped

  # ============================================================
  # 4. Paperclip (Orchestration — Python)
  # ============================================================
  paperclip:
    image: python:3.11-slim
    container_name: paperclip-orchestrator
    working_dir: /app/paperclip
    ports:
      - "8080:8080"
    volumes:
      - ./paperclip:/app/paperclip
      - ./shared-libraries:/app/shared-libraries  # shared-libs 공유
    environment:
      <<: [*llm-env, *db-env]
      SERVICE_NAME: paperclip
      OPENCLAW_HOST: http://openclaw:3000
      PYTHONPATH: /app
    depends_on:
      <<: *depends-infra
    <<: *extra-hosts
    networks:
      - mediiot-network
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    restart: unless-stopped

  # ============================================================
  # 5. PostgreSQL
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg15   # pgvector 확장 포함 (Week 3 업그레이드)
    container_name: postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: mediiot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh  # 초기화 스크립트
    networks:
      - mediiot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d mediiot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 6. Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mediiot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 6a. MinIO (D R3 D2 — S3 호환 로컬 스토리지)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio-dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - mediiot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mediiot-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/medi-dev 2>/dev/null || true &&
      echo 'minio bucket medi-dev ready'
      "
    restart: "no"

  # ============================================================
  # 6b. 코드 샌드박스 — TypeScript tsc / rustc (Phase 2 W4)
  # ============================================================
  # ============================================================
  # Dash — React 통합 관제 (Phase 2 W9 · 내부 :80 직결 + 게이트웨이 /dashboard/)
  # ============================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard-dev
    ports:
      - "3000:80"
    networks:
      - mediiot-network
    restart: unless-stopped

  code-sandbox:
    build:
      context: ./code-sandbox
      dockerfile: Dockerfile
    container_name: code-sandbox-dev
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8011:8010"
    networks:
      - mediiot-network
    restart: unless-stopped

  # ============================================================
  # 7. AutoNoGaDa ADK — 코드 자동화 (Week 4, 포트 8002)
  # ============================================================
  autonogada-api:
    build:
      context: ./AutoNoGaDa-ADK
      dockerfile: Dockerfile
    container_name: autonogada-api-dev
    ports:
      - "8002:8000"
    volumes:
      - ./AutoNoGaDa-ADK:/app
      - ./shared-libraries:/app/shared-libraries
    environment:
      <<: [*llm-env, *db-env]
      SERVICE_NAME: autonogada
      PYTHONPATH: /app/shared-libraries:/app
      GIT_AUTHOR_NAME: AutoNoGaDa CI
      GIT_AUTHOR_EMAIL: autonogada@localhost
      CODE_SANDBOX_URL: ${CODE_SANDBOX_URL:-http://code-sandbox:8010}
    depends_on:
      <<: *depends-infra
    <<: *extra-hosts
    networks:
      - mediiot-network
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ============================================================
  # 8. CoOps Platform (Week 5 Day 3 — 포트 8003)
  # ============================================================
  coops-api:
    build:
      context: ./CoOps-Platform
      dockerfile: Dockerfile
    container_name: coops-api-dev
    ports:
      - "8003:8000"
    volumes:
      - ./CoOps-Platform:/app
      - ./shared-libraries:/app/shared-libraries
    environment:
      <<: [*llm-env, *db-env]
      SERVICE_NAME: coops
      PYTHONPATH: /app/shared-libraries:/app
      COOPS_STRIPE_ENABLED: '${COOPS_STRIPE_ENABLED:-0}'
      COOPS_STRIPE_SECRET_KEY: '${COOPS_STRIPE_SECRET_KEY:-}'
      COOPS_STRIPE_PRICE_ID_ENT: '${COOPS_STRIPE_PRICE_ID_ENT:-}'
    depends_on:
      <<: *depends-infra
    <<: *extra-hosts
    networks:
      - mediiot-network
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  # ============================================================
  # 9. Health aggregator (Nginx /api/health 집계)
  # ============================================================
  health-aggregator:
    build:
      context: ./health-aggregator
      dockerfile: Dockerfile
    container_name: health-aggregator-dev
    environment:
      BACKEND_MEDICAL_URL: http://medi-iot-api:8000/health
      BACKEND_CODE_URL: http://autonogada-api:8000/health
      BACKEND_OPS_URL: http://coops-api:8000/health
    depends_on:
      - medi-iot-api
      - autonogada-api
      - coops-api
    networks:
      - mediiot-network
    restart: unless-stopped

  # ============================================================
  # 10a. Prometheus (Phase 2 M3 Step 5 — chunking_* SLO 수집)
  # ============================================================
  # /metrics/prometheus 가 활성화된 3개 서비스 (medi-iot-api / coops-api /
  # autonogada-api) 의 chunking_* 메트릭을 scrape. 알람 규칙 (alerts.yml) 은
  # book §16.10.3 SLO 와 1:1, Prometheus /alerts UI 에서 발화 확인 가능.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./observability-stack/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability-stack/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'   # 1주 데이터 보존 (SLO 검증용)
      - '--web.enable-lifecycle'             # /-/reload 핫-리로드 지원
      - '--web.enable-admin-api'
    depends_on:
      - medi-iot-api
      - coops-api
      - autonogada-api
    networks:
      - mediiot-network
    restart: unless-stopped

  # ============================================================
  # 10b. Grafana (Phase 2 M3 Step 5 — chunking 대시보드 자동 프로비저닝)
  # ============================================================
  # observability-stack/grafana/provisioning 의 datasource + dashboard 설정이
  # 컨테이너 기동 시 자동 적용된다 — 별도 UI 설정 불필요.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana-dev
    ports:
      - "3001:3000"   # 3000 은 dashboard-dev 가 점유 — 3001 사용
    volumes:
      - ./observability-stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability-stack/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # dev 편의 — 운영에선 false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
    networks:
      - mediiot-network
    restart: unless-stopped

  # ============================================================
  # 11. API Gateway — Nginx (:80 → /api/medical|code|ops/, /api/health)
  # ============================================================
  api-gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: api-gateway-dev
    ports:
      - "80:80"
    depends_on:
      - health-aggregator
      - medi-iot-api
      - autonogada-api
      - coops-api
      - dashboard
    volumes:
      - ./shared-libraries/reports/harness:/var/www/harness-reports:ro
    networks:
      - mediiot-network
    restart: unless-stopped

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    name: mediiot-postgres-data
  redis_data:
    name: mediiot-redis-data
  minio_data:
    name: mediiot-minio-data
  prometheus_data:
    name: mediiot-prometheus-data
  grafana_data:
    name: mediiot-grafana-data

# ============================================================
# Networks
# ============================================================
networks:
  mediiot-network:
    name: mediiot-dev-network
    driver: bridge
