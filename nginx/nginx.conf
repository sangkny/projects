# Week 6 — 3 플랫폼 단일 진입점
# 내부 포트: 각 API 컨테이너는 8000에서 uvicorn

upstream upstream_medical {
    server medi-iot-api:8000;
}

upstream upstream_code {
    server autonogada-api:8000;
}

upstream upstream_ops {
    server coops-api:8000;
}

upstream upstream_aggregate {
    server health-aggregator:8090;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    # --- 플랫폼별 프록시 (/api/medical/... → 백엔드 /...) ---
    location /api/medical/ {
        rewrite ^/api/medical/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://upstream_medical;
    }

    location /api/code/ {
        rewrite ^/api/code/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://upstream_code;
    }

    location /api/ops/ {
        rewrite ^/api/ops/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://upstream_ops;
    }

    # --- 전체 헬스 집계 (health-aggregator 마이크로서비스) ---
    location = /api/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://upstream_aggregate/aggregate;
    }

    location = / {
        default_type application/json;
        return 200 '{"service":"api-gateway","paths":["/api/medical/","/api/code/","/api/ops/","/api/health"]}\n';
    }
}
