# Week 9 — 게이트웨이 + 대시보드 + Harness 리포트 정적 경로

upstream upstream_medical {
    server medi-iot-api:8000;
}

upstream upstream_code {
    server autonogada-api:8000;
}

upstream upstream_ops {
    server coops-api:8000;
}

upstream upstream_aggregate {
    server health-aggregator:8090;
}

upstream upstream_dashboard {
    server dashboard:80;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    # --- Harness JSON (마운트: /var/www/harness-reports) ---
    location /harness-report/ {
        alias /var/www/harness-reports/;
        default_type application/json;
        try_files $uri =404;
    }

    location /dashboard/ {
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://upstream_dashboard/;
    }

    location = /dashboard {
        return 302 /dashboard/;
    }

    # --- 플랫폼별 프록시 (/api/medical/... → 백엔드 /...) ---
    location /api/medical/ {
        rewrite ^/api/medical/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://upstream_medical;
    }

    location /api/code/ {
        rewrite ^/api/code/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://upstream_code;
    }

    location /api/ops/ {
        rewrite ^/api/ops/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://upstream_ops;
    }

    # --- 전체 헬스 집계 (health-aggregator 마이크로서비스) ---
    location = /api/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://upstream_aggregate/aggregate;
    }

    location = / {
        default_type application/json;
        return 200 '{"service":"api-gateway","paths":["/dashboard/","/api/medical/","/api/code/","/api/ops/","/api/health","/harness-report/"]}\n';
    }
}
