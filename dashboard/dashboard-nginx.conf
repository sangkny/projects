server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 안저 업로드(양안·comprehensive) — nginx 기본 1m 초과 방지 (MEDI MAX_FUNDUS_BYTES=20MB와 정렬)
    client_max_body_size 20M;

    gzip on;
    gzip_types application/javascript application/json text/css;

    # MEDI Portal API — Vite dev proxy(/api/v1→:8001)와 동일 (프로덕션 빌드 VITE_API_URL 비움 → same-origin)
    location /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://medi-iot-api:8000;
    }

    # api-gateway가 /dashboard/ prefix strip 후 전달하는 경로 (/assets/* 등)
    location /assets/ {
        try_files $uri =404;
    }

    # Vite base=/dashboard/ — :3000 직접 접속 시 정적 자산 (디스크는 /assets/*)
    location /dashboard/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    # Vite base=/dashboard/ — SPA 라우트 fallback
    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location = /dashboard {
        return 302 /dashboard/;
    }

    # gateway strip 경로 + 루트 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
